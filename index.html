<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14232e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Världsradion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: en kolumn med sökpanel överst, kanallista, fast spelare längst ner som en gammal radioskala */
:root{
  --bg:#f3f1ec; --surface:#fffdf8; --fg:#1c2329; --muted:#66707a; --line:#dcd8cf;
  --accent:#c2410c; --accent-fg:#fff; --dial:#14232e; --dial-fg:#f2e9d8; --dial-glow:#f5b041;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12171b; --surface:#1a2127; --fg:#e8e4dc; --muted:#98a2ab; --line:#2b343c;
  --accent:#f0743a; --accent-fg:#1a0e06; --dial:#0b1116; --dial-fg:#f2e9d8; --dial-glow:#f5b041; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:calc(20px + env(safe-area-inset-top,0px)) 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:600 28px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font:500 14px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.search{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-block:8px 10px}
.search input,.search select{width:100%;font:15px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.search .full{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:13px var(--body);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent)}
.status{color:var(--muted);font-size:13px;margin-block:6px;min-height:20px}
ul{list-style:none;margin:0;padding:0}
li.st{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
li.st:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
li.st.playing .nm{color:var(--accent)}
.logo{width:44px;height:44px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font:600 15px var(--display);color:var(--muted)}
.logo img{width:100%;height:100%;object-fit:cover}
.meta{min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:6px}
.fav.on{color:var(--accent)}
.player{position:fixed;left:0;right:0;bottom:0;background:var(--dial);color:var(--dial-fg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.pp{width:52px;height:52px;border-radius:50%;border:0;background:var(--dial-glow);color:#1b1206;font-size:20px;cursor:pointer;display:grid;place-items:center}
.pp:disabled{opacity:.4;cursor:default}
.now{min-width:0}
.now .t{font:600 16px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .s{font:12px var(--mono);color:color-mix(in srgb,var(--dial-fg) 65%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vol{width:90px;accent-color:var(--dial-glow)}
.ctl{display:flex;align-items:center;gap:10px}
.cast{width:40px;height:40px;border-radius:50%;border:1px solid color-mix(in srgb,var(--dial-fg) 30%,transparent);background:none;color:var(--dial-fg);display:grid;place-items:center;cursor:pointer}
.cast.on{color:var(--dial-glow);border-color:var(--dial-glow)}
.sov{height:40px;min-width:40px;padding:0 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--dial-fg) 30%,transparent);background:none;color:var(--dial-fg);display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.sov.on{color:var(--dial-glow);border-color:var(--dial-glow)}
.sovmeny{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px;width:min(280px,calc(100vw - 32px));z-index:10}
.sovmeny h2{font:600 15px var(--display);margin:0 0 8px}
.sovval{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sovval button{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 14px var(--body);padding:9px 0;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums}
.sovval button.av{grid-column:1/-1;color:var(--muted)}
.empty{padding:30px 4px;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,li.st:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){.vol{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Världsradion</h1>
      <div class="sub">Radio från hela världen, direkt från kanalen</div>
    </div>
    <div class="tabs" role="tablist">
      <button id="tabSok" role="tab" aria-selected="true">Sök</button>
      <button id="tabFav" role="tab" aria-selected="false">Favoriter</button>
    </div>
  </header>

  <section id="sokPanel">
    <div class="search">
      <input id="q" class="full" type="search" placeholder="Kanalens namn, t.ex. France Inter" autocomplete="off">
      <select id="land"><option value="">Alla länder</option></select>
      <input id="genre" type="search" placeholder="Genre, t.ex. jazz" autocomplete="off">
    </div>
    <div class="chips" id="snabb"></div>
  </section>

  <div class="status" id="status">Hämtar kanaler …</div>
  <ul id="lista"></ul>
</div>

<div class="player">
  <div class="in">
    <button class="pp" id="pp" disabled aria-label="Spela">▶</button>
    <div class="now"><div class="t" id="nuNamn">Ingen kanal vald</div><div class="s" id="nuInfo">Tryck på en kanal för att lyssna</div></div>
    <div class="ctl">
      <button class="sov" id="sov" aria-label="Sovtimer" title="Sovtimer">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span id="sovTid" hidden></span>
      </button>
      <button class="cast" id="cast" hidden aria-label="Spela på annan högtalare" title="AirPlay / Cast">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 15l5 6H7z" fill="currentColor"/></svg>
      </button>
      <input class="vol" id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volym">
    </div>
  </div>
</div>
<div class="sovmeny" id="sovMeny" hidden role="dialog" aria-label="Sovtimer">
  <h2>Stäng av radion om</h2>
  <div class="sovval">
    <button data-min="15">15 min</button><button data-min="30">30 min</button><button data-min="45">45 min</button>
    <button data-min="60">1 tim</button><button data-min="90">1,5 tim</button><button data-min="120">2 tim</button>
    <button class="av" data-min="0">Stäng av timern</button>
  </div>
</div>
<audio id="ljud" preload="none" x-webkit-airplay="allow"></audio>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const ljud = $('ljud');
  const regionNamn = (()=>{ try{ const d=new Intl.DisplayNames(['sv'],{type:'region'}); return c=>{ try{return d.of(c)}catch(e){return c} }; }catch(e){ return c=>c } })();
  const SNABB = [['FR','Frankrike'],['IT','Italien'],['ES','Spanien'],['GB','Storbritannien'],['DE','Tyskland'],['US','USA'],['GR','Grekland'],['IE','Irland']];

  let servrar = ['https://de1.api.radio-browser.info','https://fi1.api.radio-browser.info','https://de2.api.radio-browser.info'];
  let aktuell = null, visarFav = false, senaste = [];

  // ---- favoriter (sparas i webbläsaren) ----
  function hamtaFav(){ try{ return JSON.parse(localStorage.getItem('varldsradion-fav')||'[]') }catch(e){ return [] } }
  function sparaFav(f){ try{ localStorage.setItem('varldsradion-fav',JSON.stringify(f)) }catch(e){} }
  let fav = hamtaFav();
  const arFav = id => fav.some(s=>s.stationuuid===id);

  // ---- API ----
  async function api(path){
    let fel;
    for(const s of servrar){
      try{
        const r = await fetch(s+path,{headers:{'Accept':'application/json'}});
        if(r.ok) return await r.json();
        fel = new Error('HTTP '+r.status);
      }catch(e){ fel = e }
    }
    throw fel;
  }

  async function laddaLander(){
    try{
      const l = await api('/json/countries?hidebroken=true&order=stationcount&reverse=true');
      const sel = $('land');
      l.filter(x=>x.iso_3166_1 && x.stationcount>4)
       .map(x=>({k:x.iso_3166_1.toUpperCase(), n:regionNamn(x.iso_3166_1.toUpperCase()), c:x.stationcount}))
       .sort((a,b)=>a.n.localeCompare(b.n,'sv'))
       .forEach(x=>{ const o=document.createElement('option'); o.value=x.k; o.textContent=`${x.n} (${x.c})`; sel.appendChild(o) });
    }catch(e){}
  }

  function byggSnabb(){
    const box=$('snabb');
    SNABB.forEach(([k,n])=>{
      const b=document.createElement('button'); b.className='chip'; b.textContent=n; b.dataset.k=k;
      b.onclick=()=>{
        const sel=$('land');
        if(![...sel.options].some(o=>o.value===k)){ const o=document.createElement('option'); o.value=k; o.textContent=n; sel.appendChild(o) }
        sel.value = sel.value===k ? '' : k; sok();
      };
      box.appendChild(b);
    });
  }
  function markeraSnabb(){ document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===$('land').value)) }

  let sokNr=0;
  async function sok(){
    markeraSnabb();
    const nr=++sokNr;
    const p=new URLSearchParams({hidebroken:'true',order:'clickcount',reverse:'true',limit:'80'});
    const q=$('q').value.trim(), land=$('land').value, genre=$('genre').value.trim().toLowerCase();
    if(q) p.set('name',q);
    if(land) p.set('countrycode',land);
    if(genre) p.set('tag',genre);
    $('status').textContent='Söker …';
    try{
      let res = await api('/json/stations/search?'+p);
      if(nr!==sokNr) return;
      // ta bort dubbletter med samma namn
      const sett=new Set(); res=res.filter(s=>{const k=(s.name||'').trim().toLowerCase(); if(!k||sett.has(k))return false; sett.add(k); return true});
      senaste=res;
      if(!visarFav) visa(res, res.length ? `${res.length} kanaler` : 'Inga kanaler hittades. Prova ett annat namn eller land.');
    }catch(e){
      if(nr===sokNr && !visarFav) visa([], 'Kunde inte nå kanaldatabasen. Kontrollera nätet och försök igen.');
    }
  }

  function info(s){
    const delar=[];
    if(s.countrycode) delar.push(regionNamn(s.countrycode.toUpperCase()));
    const tags=(s.tags||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,3);
    if(tags.length) delar.push(tags.join(', '));
    if(s.bitrate) delar.push(s.bitrate+' kbps');
    return delar.join(' · ');
  }

  function visa(stationer, statustext){
    $('status').textContent=statustext||'';
    const ul=$('lista'); ul.innerHTML='';
    if(!stationer.length && visarFav){
      ul.innerHTML='<li class="empty">Inga favoriter än. Tryck på stjärnan vid en kanal för att spara den här.</li>';
      return;
    }
    stationer.forEach(s=>{
      const li=document.createElement('li'); li.className='st'; li.tabIndex=0;
      if(aktuell && aktuell.stationuuid===s.stationuuid) li.classList.add('playing');
      const logo=document.createElement('div'); logo.className='logo';
      logo.textContent=(s.name||'?').trim().charAt(0).toUpperCase();
      if(s.favicon && /^https:/.test(s.favicon)){
        const img=new Image(); img.alt=''; img.loading='lazy'; img.referrerPolicy='no-referrer';
        img.onload=()=>{logo.textContent='';logo.appendChild(img)}; img.src=s.favicon;
      }
      const meta=document.createElement('div'); meta.className='meta';
      const nm=document.createElement('div'); nm.className='nm'; nm.textContent=(s.name||'').trim();
      const inf=document.createElement('div'); inf.className='info'; inf.textContent=info(s);
      meta.append(nm,inf);
      const f=document.createElement('button'); f.className='fav'+(arFav(s.stationuuid)?' on':'');
      f.textContent=arFav(s.stationuuid)?'★':'☆'; f.setAttribute('aria-label','Favorit');
      f.onclick=e=>{ e.stopPropagation(); vaxlaFav(s) };
      li.append(logo,meta,f);
      li.onclick=()=>spela(s);
      li.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); spela(s) } };
      ul.appendChild(li);
    });
  }

  function vaxlaFav(s){
    if(arFav(s.stationuuid)) fav=fav.filter(x=>x.stationuuid!==s.stationuuid);
    else fav.push({stationuuid:s.stationuuid,name:s.name,url_resolved:s.url_resolved,url:s.url,favicon:s.favicon,countrycode:s.countrycode,tags:s.tags,bitrate:s.bitrate,codec:s.codec,hls:s.hls});
    sparaFav(fav);
    visarFav ? visa(fav, fav.length?`${fav.length} favoriter`:'') : visa(senaste, $('status').textContent);
  }

  // ---- spelaren ----
  let castSession=null, remote=null, remoteCtl=null;
  const castar=()=>!!castSession;
  const enhet=()=>{ try{ return castSession.getCastDevice().friendlyName }catch(e){ return 'högtalaren' } };
  function setPP(spelar){ $('pp').textContent=spelar?'❚❚':'▶'; $('pp').setAttribute('aria-label',spelar?'Pausa':'Spela') }

  function spelaLokalt(s){
    ljud.src=s.url_resolved||s.url;
    ljud.play().catch(()=>{});
  }
  function stoppaLokalt(){ ljud.pause(); ljud.removeAttribute('src'); ljud.load() }

  function mime(s){
    if(s.hls==1 || /\.m3u8(\?|$)/i.test(s.url_resolved||'')) return 'application/x-mpegurl';
    const c=(s.codec||'').toUpperCase();
    if(c.startsWith('AAC')) return 'audio/aac';
    if(c==='OGG'||c==='VORBIS'||c==='OPUS') return 'audio/ogg';
    if(c==='FLAC') return 'audio/flac';
    return 'audio/mpeg';
  }
  function castLadda(s){
    const mi=new chrome.cast.media.MediaInfo(s.url_resolved||s.url, mime(s));
    mi.streamType=chrome.cast.media.StreamType.LIVE;
    const md=new chrome.cast.media.MusicTrackMediaMetadata();
    md.title=(s.name||'').trim(); md.artist=info(s);
    if(s.favicon && /^https:/.test(s.favicon)) md.images=[new chrome.cast.Image(s.favicon)];
    mi.metadata=md;
    const req=new chrome.cast.media.LoadRequest(mi); req.autoplay=true;
    $('nuInfo').textContent='Ansluter på '+enhet()+' …';
    castSession.loadMedia(req).then(
      ()=>{ $('nuInfo').textContent='Spelar på '+enhet(); setPP(true) },
      ()=>{ $('nuInfo').textContent=enhet()+' kunde inte spela kanalen. Prova en annan.'; setPP(false) }
    );
  }

  function spela(s){
    aktuell=s;
    $('nuNamn').textContent=(s.name||'').trim();
    $('nuInfo').textContent='Ansluter …';
    $('pp').disabled=false;
    castar() ? castLadda(s) : spelaLokalt(s);
    visarFav ? visa(fav,$('status').textContent) : visa(senaste,$('status').textContent);
    // tala om för databasen att kanalen spelades (håller topplistan levande)
    if(s.stationuuid) api('/json/url/'+s.stationuuid).catch(()=>{});
    if('mediaSession' in navigator){
      try{
        navigator.mediaSession.metadata=new MediaMetadata({title:(s.name||'').trim(),artist:info(s),artwork:s.favicon&&/^https:/.test(s.favicon)?[{src:s.favicon}]:[]});
        navigator.mediaSession.setActionHandler('play',()=>spelaPaus(true));
        navigator.mediaSession.setActionHandler('pause',()=>spelaPaus(false));
      }catch(e){}
    }
  }
  function spelaPaus(vill){
    if(!aktuell) return;
    if(castar()){
      const igang = remote && remote.isMediaLoaded && !remote.isPaused;
      if(vill===undefined) vill=!igang;
      if(vill) castLadda(aktuell); else if(remoteCtl) remoteCtl.stop();
      return;
    }
    if(vill===undefined) vill=ljud.paused;
    vill ? spelaLokalt(aktuell) : stoppaLokalt();
  }
  ljud.addEventListener('playing',()=>{ if(castar())return; setPP(true); if(aktuell) $('nuInfo').textContent=info(aktuell)||'Spelar' });
  ljud.addEventListener('pause',()=>{ if(!castar()) setPP(false) });
  ljud.addEventListener('waiting',()=>{ if(!castar()) $('nuInfo').textContent='Buffrar …' });
  ljud.addEventListener('error',()=>{ if(aktuell && !castar() && ljud.getAttribute('src')){ $('nuInfo').textContent='Kanalen gick inte att spela just nu. Prova en annan.'; setPP(false) } });
  $('pp').onclick=()=>spelaPaus();
  $('vol').oninput=e=>{ ljud.volume=+e.target.value; if(castar() && remoteCtl){ remote.volumeLevel=+e.target.value; remoteCtl.setVolumeLevel() } };


  // ---- sovtimer ----
  let sovSlut=0, sovKlocka=null;
  const sovBtn=$('sov'), sovMeny=$('sovMeny'), sovTid=$('sovTid');
  function sovVisa(){
    if(!sovSlut){ sovTid.hidden=true; sovBtn.classList.remove('on'); sovBtn.setAttribute('aria-label','Sovtimer'); return }
    const kvar=Math.max(0,sovSlut-Date.now()), min=Math.ceil(kvar/60000);
    sovTid.hidden=false; sovTid.textContent=min+' min';
    sovBtn.classList.add('on'); sovBtn.setAttribute('aria-label','Sovtimer, '+min+' minuter kvar');
  }
  function sovStall(min){
    clearInterval(sovKlocka); sovKlocka=null; sovSlut=0;
    if(min>0){
      sovSlut=Date.now()+min*60000;
      sovKlocka=setInterval(()=>{ if(Date.now()>=sovSlut) sovKlar(); else sovVisa() },1000);
    }
    sovVisa();
  }
  function sovKlar(){
    sovStall(0);
    spelaPaus(false);
    if(aktuell) $('nuInfo').textContent='Sovtimern stängde av radion. God natt!';
  }
  sovBtn.onclick=e=>{ e.stopPropagation(); sovMeny.hidden=!sovMeny.hidden };
  sovMeny.addEventListener('click',e=>{
    e.stopPropagation();
    const b=e.target.closest('button[data-min]'); if(!b) return;
    sovStall(+b.dataset.min); sovMeny.hidden=true;
  });
  document.addEventListener('click',()=>{ sovMeny.hidden=true });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') sovMeny.hidden=true });
  // om telefonen har sovit en stund: kontrollera direkt när sidan vaknar
  document.addEventListener('visibilitychange',()=>{ if(sovSlut && Date.now()>=sovSlut) sovKlar(); else sovVisa() });

  // ---- AirPlay (Safari) och Google Cast (Chrome) ----
  const castBtn=$('cast');
  if(window.WebKitPlaybackTargetAvailabilityEvent){
    // Safari: visa knappen när det finns AirPlay-mottagare i närheten
    // iPhone meddelar inte alltid när mottagare finns, så knappen visas alltid här
    castBtn.hidden=false;
    ljud.addEventListener('webkitcurrentplaybacktargetiswirelesschanged',()=>{ castBtn.classList.toggle('on',!!ljud.webkitCurrentPlaybackTargetIsWireless) });
    castBtn.onclick=()=>{
      if(!ljud.getAttribute('src') && aktuell) ljud.src=aktuell.url_resolved||aktuell.url;
      try{ ljud.webkitShowPlaybackTargetPicker() }catch(e){}
    };
  } else {
    // Reserv: webbläsarens inbyggda fjärruppspelning, tills Googles Cast-stöd har laddats
    if(ljud.remote && ljud.remote.watchAvailability){
      ljud.remote.watchAvailability(a=>{ castBtn.hidden=!a }).catch(()=>{});
      castBtn.onclick=()=>{ if(!ljud.getAttribute('src') && aktuell) ljud.src=aktuell.url_resolved||aktuell.url; ljud.remote.prompt().catch(()=>{}) };
    }
    window['__onGCastApiAvailable']=function(ok){
      if(!ok || !window.cast || !cast.framework) return;
      try{ ljud.remote && ljud.remote.cancelWatchAvailability && ljud.remote.cancelWatchAvailability().catch(()=>{}) }catch(e){}
      const ctx=cast.framework.CastContext.getInstance();
      ctx.setOptions({receiverApplicationId:chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID, autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});
      remote=new cast.framework.RemotePlayer();
      remoteCtl=new cast.framework.RemotePlayerController(remote);
      const visaLage=st=>{ castBtn.hidden = st===cast.framework.CastState.NO_DEVICES_AVAILABLE; castBtn.classList.toggle('on', st===cast.framework.CastState.CONNECTED) };
      visaLage(ctx.getCastState());
      ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED,e=>visaLage(e.castState));
      ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED,e=>{
        const S=cast.framework.SessionState;
        if(e.sessionState===S.SESSION_STARTED || e.sessionState===S.SESSION_RESUMED){
          castSession=ctx.getCurrentSession();
          const lat=!ljud.paused; stoppaLokalt();
          if(aktuell && (lat || e.sessionState===S.SESSION_STARTED)) castLadda(aktuell);
          else $('nuInfo').textContent='Ansluten till '+enhet();
        } else if(e.sessionState===S.SESSION_ENDED){
          castSession=null; setPP(false);
          if(aktuell) $('nuInfo').textContent='Castningen avslutades. Tryck ▶ för att lyssna här.';
        }
      });
      remoteCtl.addEventListener(cast.framework.RemotePlayerEventType.PLAYER_STATE_CHANGED,()=>{
        if(!castar()) return;
        const st=remote.playerState;
        if(st==='BUFFERING') $('nuInfo').textContent='Buffrar på '+enhet()+' …';
        else if(st==='PLAYING'){ setPP(true); $('nuInfo').textContent='Spelar på '+enhet() }
        else if(st==='IDLE' || st==='PAUSED' || st==null) setPP(false);
      });
      castBtn.onclick=()=>{ ctx.requestSession().catch(()=>{}) };
    };
    const sc=document.createElement('script');
    sc.src='https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
    sc.async=true; document.head.appendChild(sc);
  }

  // ---- flikar och sökfält ----
  function flik(fv){
    visarFav=fv;
    $('tabSok').setAttribute('aria-selected',!fv); $('tabFav').setAttribute('aria-selected',fv);
    $('sokPanel').hidden=fv;
    fv ? visa(fav, fav.length?`${fav.length} favoriter`:'') : visa(senaste, senaste.length?`${senaste.length} kanaler`:'');
  }
  $('tabSok').onclick=()=>flik(false);
  $('tabFav').onclick=()=>flik(true);
  let t; const fordrojd=()=>{ clearTimeout(t); t=setTimeout(sok,350) };
  $('q').addEventListener('input',fordrojd);
  $('genre').addEventListener('input',fordrojd);
  $('land').addEventListener('change',sok);

  byggSnabb();
  laddaLander();
  if(fav.length){ flik(true); sok() } else { $('land').value=''; sok() }
})();
</script>
</body>
</html>
